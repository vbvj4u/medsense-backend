name: Deploy - prod

# Scaffold only - see deploy-staging.yml. Add required reviewers on the
# "prod" GitHub Environment so this always needs a human approval.

on:
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    uses: ./.github/workflows/_deploy-reusable.yml
    with:
      environment: prod
    secrets: inherit
