name: Deploy - dev

on:
  push:
    branches: [main]

jobs:
  deploy:
    needs: []
    uses: ./.github/workflows/_deploy-reusable.yml
    with:
      environment: dev
    secrets:
      AWS_DEPLOY_ROLE_ARN: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
      LAMBDA_FUNCTION_NAME: ${{ secrets.LAMBDA_FUNCTION_NAME }}
