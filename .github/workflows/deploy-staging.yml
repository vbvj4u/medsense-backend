name: Deploy - staging

# Scaffold only - see medsense-infra's terraform-staging.yml. Point a
# "staging" GitHub Environment at a real deploy role + Lambda function
# name once that environment is actually deployed.

on:
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read
  
jobs:
  deploy:
    uses: ./.github/workflows/_deploy-reusable.yml
    with:
      environment: staging
    secrets: inherit
